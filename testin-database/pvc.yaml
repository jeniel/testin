apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testin-data
  namespace: testin
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 10Gi
