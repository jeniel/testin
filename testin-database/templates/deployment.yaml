apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.appName }}-secret
      containers:
        - image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          name: {{ .Values.appName }}
          ports:
            - containerPort: 4173
          envFrom:
            - configMapRef:
                name: {{ .Values.appName }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 4173
      name: {{ .Values.appName }}
  selector:
    app: {{ .Values.appName }}
---
