apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
      containers:
      - name: databasus

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 8080

        volumeMounts:
        - name: data
          mountPath: /data

        resources:
{{ toYaml .Values.resources | indent 10 }}

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}

spec:
  selector:
    app: {{ .Release.Name }}

  ports:
    - port: 8080
      targetPort: 8080

  type: {{ .Values.service.type }}